name: Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: browser-linux:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d \
            --name browser-linux-ci \
            --shm-size=1g \
            -e VNC_PASSWORD=ci-test-password \
            -p 127.0.0.1:6080:6080 \
            browser-linux:test

      - name: Wait for noVNC and container health
        run: |
          set -eu
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null; then
              echo "noVNC is responding"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for noVNC"
          docker logs browser-linux-ci
          exit 1

      - name: Verify container health
        run: |
          set -eu
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' browser-linux-ci)
            echo "Health status: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs browser-linux-ci
              exit 1
            fi
            sleep 2
          done
          docker logs browser-linux-ci
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs browser-linux-ci

      - name: Stop container
        if: always()
        run: docker rm -f browser-linux-ci
