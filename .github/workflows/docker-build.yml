name: Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gdc420s/browser-linux

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: browser-linux:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d \
            --name browser-linux-ci \
            --shm-size=1g \
            --security-opt no-new-privileges:true \
            -e VNC_PASSWORD=ci-test-password \
            -p 127.0.0.1:6080:6080 \
            browser-linux:test

      - name: Wait for noVNC and container health
        run: |
          set -eu
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null; then
              echo "noVNC is responding"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for noVNC"
          docker logs browser-linux-ci
          exit 1

      - name: Verify container health
        run: |
          set -eu
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' browser-linux-ci)
            echo "Health status: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs browser-linux-ci
              exit 1
            fi
            sleep 2
          done
          docker logs browser-linux-ci
          exit 1

      - name: Verify desktop services and Firefox
        run: |
          set -eu
          docker exec browser-linux-ci supervisorctl status
          docker exec browser-linux-ci sh -c 'xdpyinfo -display :1 >/dev/null'
          docker exec browser-linux-ci sh -c 'nc -z 127.0.0.1 5900'
          docker exec browser-linux-ci firefox --version

      - name: Verify runtime security settings
        run: |
          set -eu
          echo "Checking no-new-privileges"
          test "$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' browser-linux-ci)" = '["no-new-privileges:true"]'
          echo "Checking localhost-only port binding"
          test "$(docker inspect --format '{{json .HostConfig.PortBindings}}' browser-linux-ci)" = '{"6080/tcp":[{"HostIp":"127.0.0.1","HostPort":"6080"}]}'
          echo "Checking Snap is absent"
          docker exec browser-linux-ci sh -c '! command -v snap >/dev/null 2>&1'
          echo "Checking sudo is absent"
          docker exec browser-linux-ci sh -c '! command -v sudo >/dev/null 2>&1'
          echo "Checking linuxuser is non-root"
          docker exec browser-linux-ci sh -c 'test "$(id -u linuxuser)" -ne 0'
          echo "Checking VNC password file permissions"
          docker exec browser-linux-ci sh -c 'test "$(stat -c %a /etc/x11vnc/passwd)" = 600'

      - name: Show container logs
        if: always()
        run: docker logs browser-linux-ci

      - name: Stop container
        if: always()
        run: docker rm -f browser-linux-ci

      - name: Publish image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
